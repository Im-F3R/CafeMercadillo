<div class="wrap">
  {{ruta}}{{buscador}}{{titulo}}{{subcategorias}}
  <div class="toolbar">
    <span id="catalog-count">{{cantidadResultados}} productos encontrados</span>
    <div>
      <select id="sort" aria-label="Ordenar productos">
        {{opcionesOrden}}
      </select>
      <button class="chip" data-action="filters" aria-controls="filters" aria-expanded="false">Filtros <span aria-hidden="true">☷</span></button>
    </div>
  </div>
  <div class="catalog">
    <aside class="filters" id="filters">
      <h2 class="filter-title">Filtrar productos</h2>
      {{filtroCategoria}}
      <label>
        Precio máximo: {{precioMaximo}}
        <input type="range" min="3" max="50" value="{{valorPrecio}}" data-filter="price" />
      </label>
      {{filtroPresentacion}}{{filtroOrigen}}{{filtrosCafe}}
      <label>
        <input type="checkbox" data-filter="stock" {{soloDisponibles}} />
        Solo disponibles
      </label>
      <button class="btn secondary" data-action="clear-filters">Limpiar filtros</button>
    </aside>
    <section aria-labelledby="catalog-products-title">
      <h2 id="catalog-products-title" class="sr-only">Productos encontrados</h2>
      {{productos}}{{paginacion}}
    </section>
  </div>
  {{recomendados}}{{informacionCafe}}
</div>
