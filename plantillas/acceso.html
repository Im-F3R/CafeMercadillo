<div class="wrap">
  <div class="auth panel">
    <div class="chips" role="group" aria-label="Acceso a la cuenta">
      <button class="chip {{claseAcceso}}" data-action="auth-tab" data-value="login">
        Iniciar sesión
      </button>
      <button class="chip {{claseRegistro}}" data-action="auth-tab" data-value="register">
        Crear cuenta
      </button>
    </div>
    <h1 class="auth-title">{{titulo}}</h1>
    <p>Tu rincón de sabores lojanos.</p>
    <form data-form="auth">
      {{datosRegistro}}{{correo}}{{contrasena}}{{confirmacion}}
      <button class="btn full">{{textoBoton}}</button>
    </form>
    {{recuperacion}}
    <p class="demo-note">
      Demostración académica. Crea tu cuenta con una contraseña de al menos 6 caracteres. Las compras y los pagos son de prueba.
    </p>
  </div>
</div>
