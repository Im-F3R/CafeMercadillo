<aside class="panel summary">
  <h2 class="summary-title">{{titulo}}</h2>
  {{productos}}
  <div class="sumrow">
    <span>Subtotal</span>
    <span>{{subtotal}}</span>
  </div>
  <div class="sumrow">
    <span>Envío</span>
    <span>{{envio}}</span>
  </div>
  <div class="sumrow">
    <span>Descuento</span>
    <span>−{{descuento}}</span>
  </div>
  <div class="sumrow total">
    <span>Total</span>
    <span>{{total}}</span>
  </div>
  {{acciones}}
  <p class="demo-note">Envío gratuito desde $35. Compra de demostración, sin cobros.</p>
</aside>
